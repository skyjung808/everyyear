<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VAPID 키 생성</title><body style="font-family:system-ui;max-width:700px;margin:30px auto;padding:16px"><h1>EveryYear VAPID 키 생성기</h1><p>이 페이지는 브라우저 안에서 키를 생성합니다. 생성한 개인키는 GitHub에 올리지 말고 Supabase Function Secrets에만 저장하세요.</p><button id="go">키 생성</button><h3>공개키 (config.js에 입력)</h3><textarea id="pub" style="width:100%;height:70px"></textarea><h3>개인키 (Supabase Secrets에만 입력)</h3><textarea id="priv" style="width:100%;height:70px"></textarea><script>
const b64=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
document.getElementById('go').onclick=async()=>{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const jwk=await crypto.subtle.exportKey('jwk',k.privateKey);const raw=new Uint8Array(65);raw[0]=4;const x=Uint8Array.from(atob(jwk.x.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const y=Uint8Array.from(atob(jwk.y.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));raw.set(x,1);raw.set(y,33);document.getElementById('pub').value=b64(raw);document.getElementById('priv').value=jwk.d;};
</script></body></html>
